<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 40%, #312e81 100%);
            padding: 40px;
            overflow-x: auto;
            min-height: 100vh;
        }

        .bracket-title {
            text-align: center;
            margin-bottom: 32px;
        }

        .bracket-title h2 {
            color: #e2e8f0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .bracket-title p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 4px;
        }

        .bracket-container {
            display: flex;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .bracket {
            display: flex;
            gap: 60px;
            position: relative;
        }

        .round {
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 200px;
        }

        .round-label {
            text-align: center;
            font-weight: 700;
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 10px 16px;
            margin-bottom: 32px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .round-label.final {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.15));
            border-color: rgba(251, 191, 36, 0.3);
            color: #fbbf24;
        }

        .match-wrapper {
            position: relative;
            margin-bottom: 0;
        }

        .match {
            display: flex;
            flex-direction: column;
            position: relative;
            gap: 2px;
        }

        .player-slot {
            display: flex;
            align-items: center;
            height: 44px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        .player-slot:first-child {
            border-radius: 8px 8px 2px 2px;
        }

        .player-slot:last-child {
            border-radius: 2px 2px 8px 8px;
        }

        .player-slot:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateX(3px);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .player-slot .seed {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .player-slot .name {
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-slot.winner {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(22, 163, 74, 0.15));
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.15);
        }

        .player-slot.winner .name {
            color: #4ade80;
            font-weight: 700;
        }

        .player-slot.winner .seed {
            background: rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        .player-slot.winner::before {
            content: '\2713';
            position: absolute;
            right: 12px;
            color: #4ade80;
            font-weight: 700;
            font-size: 14px;
        }

        .player-slot.bye {
            background: rgba(255, 255, 255, 0.02);
            border-style: dashed;
            border-color: rgba(255, 255, 255, 0.06);
            cursor: default;
        }

        .player-slot.bye:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.02);
            box-shadow: none;
        }

        .player-slot.bye .name {
            color: #475569;
            font-style: italic;
        }

        .player-slot.champion {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(245, 158, 11, 0.2));
            border-color: rgba(251, 191, 36, 0.6);
            box-shadow: 0 0 24px rgba(251, 191, 36, 0.2), 0 0 48px rgba(251, 191, 36, 0.1);
            animation: champion-glow 2s ease-in-out infinite alternate;
        }

        .player-slot.champion .name {
            color: #fbbf24;
            font-weight: 800;
        }

        .player-slot.champion .seed {
            background: rgba(251, 191, 36, 0.3);
            color: #fbbf24;
        }

        .player-slot.champion::before {
            content: '\1F3C6';
            position: absolute;
            right: 12px;
            font-size: 16px;
        }

        @keyframes champion-glow {
            0% {
                box-shadow: 0 0 24px rgba(251, 191, 36, 0.2), 0 0 48px rgba(251, 191, 36, 0.1);
            }

            100% {
                box-shadow: 0 0 32px rgba(251, 191, 36, 0.35), 0 0 64px rgba(251, 191, 36, 0.15);
            }
        }

        .player-slot.empty {
            background: rgba(255, 255, 255, 0.02);
            border-style: dashed;
            border-color: rgba(255, 255, 255, 0.06);
            cursor: default;
        }

        .player-slot.empty:hover {
            transform: none;
            box-shadow: none;
        }

        .player-slot.empty .name {
            color: #334155;
            font-style: italic;
        }

        .svg-connectors {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .final-match .player-slot {
            border-width: 2px;
        }
    </style>
</head>

<body>
    <div class="bracket-title">
        <h2>&#9876;&#65039; Cuadro Eliminatorio</h2>
        <p id="subtitle"></p>
    </div>
    <div class="bracket-container">
        <div id="bracket" class="bracket"></div>
        <svg id="connectors" class="svg-connectors"></svg>
    </div>

    <script>
        // ===== Streamlit Communication (raw protocol, no CDN needed) =====
        function sendMessageToStreamlit(type, data) {
            var msg = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
            window.parent.postMessage(msg, "*");
        }
        function setComponentReady() { sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 }); }
        function setFrameHeight(h) { sendMessageToStreamlit("streamlit:setFrameHeight", { height: h || document.body.scrollHeight }); }
        function setComponentValue(value) { sendMessageToStreamlit("streamlit:setComponentValue", { value: value }); }

        var bracketData = null;
        var bracketState = {};
        var seedMap = {};
        var renderEventReceived = false;
        var lastReceivedState = null; // Para detectar cambios reales

        // Listen for render events from Streamlit
        window.addEventListener("message", function (event) {
            if (event.data && event.data.type === "streamlit:render") {
                var args = event.data.args;
                bracketData = {
                    players: args.players,
                    categoriaId: args.categoria_id,
                    numRounds: args.num_rounds,
                    canEdit: args.can_edit,
                    numOriginalPlayers: args.num_original_players
                };

                // Receive state from Python (convert string keys to int)
                var newState = {};
                var rawState = args.bracket_state || {};
                for (var k in rawState) {
                    if (rawState.hasOwnProperty(k)) {
                        if (!isNaN(k)) {
                            newState[parseInt(k)] = rawState[k];
                        } else {
                            newState[k] = rawState[k];
                        }
                    }
                }

                // Solo actualizar si el estado realmente cambió desde Python
                // Y si no hay una actualización local pendiente (debounce en curso)
                var stateChanged = JSON.stringify(newState) !== JSON.stringify(lastReceivedState);
                if ((stateChanged || !renderEventReceived) && !pendingUpdate) {
                    bracketState = newState;
                    lastReceivedState = JSON.parse(JSON.stringify(newState));

                    // Update subtitle
                    document.getElementById('subtitle').textContent =
                        bracketData.numOriginalPlayers + ' clasificados  \u2022  ' +
                        bracketData.numRounds + ' ronda' + (bracketData.numRounds > 1 ? 's' : '');

                    // Initialize bracket if empty
                    if (Object.keys(bracketState).length === 0) {
                        bracketState[1] = bracketData.players.slice();
                        for (var r = 2; r <= bracketData.numRounds; r++) {
                            var prevRound = bracketState[r - 1];
                            bracketState[r] = new Array(prevRound.length / 2).fill(null);
                        }
                    }

                    processByes();

                    seedMap = {};
                    bracketData.players.forEach(function (p, i) {
                        if (p !== "BYE") seedMap[p] = i + 1;
                    });

                    renderBracket();
                }
                renderEventReceived = true;
            }
        });

        function processByes() {
            for (var round = 1; round < bracketData.numRounds; round++) {
                var players = bracketState[round];
                for (var i = 0; i < players.length; i += 2) {
                    var p1 = players[i];
                    var p2 = players[i + 1];
                    if (p1 === "BYE" && p2 && p2 !== "BYE") {
                        bracketState[round + 1][Math.floor(i / 2)] = p2;
                    } else if (p2 === "BYE" && p1 && p1 !== "BYE") {
                        bracketState[round + 1][Math.floor(i / 2)] = p1;
                    }
                }
            }
        }

        var debounceTimer = null;
        var pendingUpdate = false;

        function selectWinner(round, matchIndex, player) {
            if (!bracketData.canEdit || player === "BYE") return;
            if (round < bracketData.numRounds) {
                bracketState[round + 1][matchIndex] = player;
            } else {
                bracketState['champion'] = player;
            }
            renderBracket();

            // Mark that we have a pending local update (prevents render event from overwriting)
            pendingUpdate = true;

            // Debounce: wait 1s after the last click before sending state to Python
            // This prevents rapid clicks from causing multiple reruns that overwrite state
            if (debounceTimer) clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function () {
                var stateToSend = {};
                for (var k in bracketState) {
                    if (bracketState.hasOwnProperty(k)) {
                        stateToSend[String(k)] = bracketState[k];
                    }
                }
                pendingUpdate = false;
                setComponentValue({
                    bracket_state: stateToSend,
                    champion: bracketState['champion'] || null
                });
            }, 1000);
        }

        function renderBracket() {
            var bracket = document.getElementById('bracket');
            bracket.innerHTML = '';
            var SLOT_HEIGHT = 44, SLOT_GAP = 2, MATCH_HEIGHT = SLOT_HEIGHT * 2 + SLOT_GAP;

            for (var round = 1; round <= bracketData.numRounds; round++) {
                var roundDiv = document.createElement('div');
                roundDiv.className = 'round';
                roundDiv.setAttribute('data-round', round);

                var label = document.createElement('div');
                label.className = 'round-label';
                if (round === bracketData.numRounds) { label.classList.add('final'); label.textContent = '\uD83C\uDFC6 FINAL'; }
                else if (round === bracketData.numRounds - 1 && bracketData.numRounds > 2) { label.textContent = 'SEMIFINAL'; }
                else if (round === bracketData.numRounds - 2 && bracketData.numRounds > 3) { label.textContent = 'CUARTOS'; }
                else { label.textContent = 'RONDA ' + round; }
                roundDiv.appendChild(label);

                var players = bracketState[round];
                var verticalSpacing = MATCH_HEIGHT * Math.pow(2, round - 1);

                for (var i = 0; i < players.length; i += 2) {
                    var matchWrapper = document.createElement('div');
                    matchWrapper.className = 'match-wrapper';
                    var extraGap = round === 1 ? 12 : 0;
                    if (i > 0) { matchWrapper.style.marginTop = (verticalSpacing - MATCH_HEIGHT + extraGap) + 'px'; }
                    else if (round > 1) { matchWrapper.style.marginTop = ((verticalSpacing - MATCH_HEIGHT) / 2) + 'px'; }

                    var matchDiv = document.createElement('div');
                    matchDiv.className = 'match';
                    if (round === bracketData.numRounds) matchDiv.classList.add('final-match');

                    var p1 = players[i], p2 = players[i + 1];
                    var matchIndex = Math.floor(i / 2);
                    var winner = null;
                    if (round < bracketData.numRounds) {
                        winner = bracketState[round + 1] ? bracketState[round + 1][matchIndex] : null;
                    } else {
                        winner = bracketState['champion'] || null;
                    }
                    var isFinalAndWon = round === bracketData.numRounds && winner;

                    [p1, p2].forEach(function (player, slotIdx) {
                        var slot = document.createElement('div');
                        slot.className = 'player-slot';
                        if (!player) {
                            slot.classList.add('empty');
                            var ns = document.createElement('span'); ns.className = 'name'; ns.textContent = 'Por definir'; slot.appendChild(ns);
                        } else if (player === "BYE") {
                            slot.classList.add('bye');
                            var ns2 = document.createElement('span'); ns2.className = 'name'; ns2.textContent = 'BYE'; slot.appendChild(ns2);
                        } else {
                            if (isFinalAndWon && winner === player) slot.classList.add('champion');
                            else if (winner === player) slot.classList.add('winner');
                            var ss = document.createElement('span'); ss.className = 'seed'; ss.textContent = seedMap[player] || '?'; slot.appendChild(ss);
                            var ns3 = document.createElement('span'); ns3.className = 'name'; ns3.textContent = player; slot.appendChild(ns3);
                            if (bracketData.canEdit) {
                                (function (r, mi, pl) { slot.onclick = function () { selectWinner(r, mi, pl); }; })(round, matchIndex, player);
                            }
                        }
                        slot.setAttribute('data-round', round);
                        slot.setAttribute('data-match', matchIndex);
                        slot.setAttribute('data-slot', slotIdx);
                        matchDiv.appendChild(slot);
                    });
                    matchWrapper.appendChild(matchDiv);
                    roundDiv.appendChild(matchWrapper);
                }
                bracket.appendChild(roundDiv);
            }
            drawConnectors();
            setFrameHeight();
        }

        function drawConnectors() {
            var svg = document.getElementById('connectors');
            var container = document.querySelector('.bracket-container');
            var containerRect = container.getBoundingClientRect();
            svg.setAttribute('width', container.scrollWidth);
            svg.setAttribute('height', container.scrollHeight);
            svg.innerHTML = '';
            for (var round = 1; round < bracketData.numRounds; round++) {
                var currentRound = document.querySelector('[data-round="' + round + '"].round');
                var nextRound = document.querySelector('[data-round="' + (round + 1) + '"].round');
                if (!currentRound || !nextRound) continue;
                var currentMatches = currentRound.querySelectorAll('.match');
                var nextMatches = nextRound.querySelectorAll('.match');
                for (var m = 0; m < currentMatches.length; m += 2) {
                    var match1 = currentMatches[m], match2 = currentMatches[m + 1];
                    var nextMatch = nextMatches[Math.floor(m / 2)];
                    if (!match1 || !nextMatch) continue;
                    var m1Rect = match1.getBoundingClientRect();
                    var m1CY = m1Rect.top + m1Rect.height / 2 - containerRect.top;
                    var m1R = m1Rect.right - containerRect.left;
                    var nmRect = nextMatch.getBoundingClientRect();
                    var nmCY = nmRect.top + nmRect.height / 2 - containerRect.top;
                    var nmL = nmRect.left - containerRect.left;
                    var midX = (m1R + nmL) / 2;
                    var path1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path1.setAttribute('d', 'M ' + m1R + ' ' + m1CY + ' C ' + midX + ' ' + m1CY + ', ' + midX + ' ' + nmCY + ', ' + nmL + ' ' + nmCY);
                    path1.setAttribute('fill', 'none'); path1.setAttribute('stroke', 'rgba(148,163,184,0.3)'); path1.setAttribute('stroke-width', '2');
                    svg.appendChild(path1);
                    if (match2) {
                        var m2Rect = match2.getBoundingClientRect();
                        var m2CY = m2Rect.top + m2Rect.height / 2 - containerRect.top;
                        var path2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path2.setAttribute('d', 'M ' + m1R + ' ' + m2CY + ' C ' + midX + ' ' + m2CY + ', ' + midX + ' ' + nmCY + ', ' + nmL + ' ' + nmCY);
                        path2.setAttribute('fill', 'none'); path2.setAttribute('stroke', 'rgba(148,163,184,0.3)'); path2.setAttribute('stroke-width', '2');
                        svg.appendChild(path2);
                    }
                }
            }
        }

        window.addEventListener('resize', function () { if (renderEventReceived) drawConnectors(); });

        // Initialize: tell Streamlit we're ready
        setComponentReady();
        setFrameHeight();
    </script>
</body>

</html>
